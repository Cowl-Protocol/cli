name: CI

# Every gate here is a command that already passes on a clean checkout. Nothing
# in this file reaches the network for a verdict: no live relayer, no RPC, no
# deployed pool. A gate that goes red because a VPS blinked is a gate everyone
# learns to route around, and then it is not a control at all.
#
# The live checks that were deliberately left out still matter and still run by
# hand: `npm run test:relay` (without --static) is the only thing that catches a
# relayer daemon left on an older build, and `npm run watch` is the only thing
# that reads the money. See audits/ for where those sit.

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, deploys, or writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Static half only. The live half asks two daemons for a quote, which is a
      # property of the infrastructure rather than of this commit.
      - run: npm run test:relay -- --static

  relayer:
    name: relayer daemon under attack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The daemon is the real one; only the chain under it is a stub, so this
      # reaches no network and needs no key. Both halves run: the cases, then
      # the mutants that prove each case constrains the defence it names.
      - run: npm run test:relayer
      - run: npm run test:relayer-mutants
      # The notification channel, on the same terms: a stub sink on loopback and
      # fake watchers, so it reaches no network and reads no chain. The mutant
      # half proves each case still constrains the defence it names.
      - run: npm run test:notify

  contracts:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      # forge-std is vendored and the proof fixtures are committed (see
      # .gitignore), so this runs from a clean clone with no forge install and no
      # circuit build. That is deliberate: the integration test is the only place
      # note math, circuit, proof, verifier and pool are checked end to end.
      - run: forge test
        working-directory: contracts

  mutants:
    name: invariant suite can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      # Breaks one pool defence at a time and requires the paired invariant to
      # catch it. Without this, an invariant could be quietly weakened into one
      # that no longer constrains anything and the suite would stay green.
      - run: ./audits/invariant/mutants.sh

  scanners:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # slither compiles through crytic-compile, which shells out to forge and
      # lets forge fetch its own solc. No separate solc install.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Both scanners are pinned to the exact versions the baseline was recorded
      # against. A scanner upgrade changes what it reports, which would read as a
      # wall of new findings and blow the baseline apart. Upgrading is a
      # deliberate act: bump the pin, re-triage, re-record.
      - run: pip install slither-analyzer==0.11.5
      - name: install aderyn 0.6.8
        run: |
          set -euo pipefail
          url=https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          curl -sSL -o aderyn.tar.xz "$url"
          echo "ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46  aderyn.tar.xz" | sha256sum -c -
          tar -xJf aderyn.tar.xz
          install -m755 aderyn-x86_64-unknown-linux-gnu/aderyn /usr/local/bin/aderyn
          rm -rf aderyn.tar.xz aderyn-x86_64-unknown-linux-gnu
      # Fails on findings nobody has triaged, not on findings. Both scanners
      # report something on every run and always will; the gate is drift from
      # the recorded baseline.
      - run: node audits/static/check.mjs

  supplychain:
    name: dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # No `npm ci`, deliberately. The install-script half reads package-lock.json
      # and nothing else, and installing the tree in order to check whether the
      # tree is safe to install would run the very scripts this is here to notice.
      #
      # This is the only gate in the file that looks at what arrives from
      # outside. Everything above it reads code somebody here wrote.
      - run: node audits/supplychain/check.mjs

  circuits:
    name: nargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          # Pinned to the toolchain the circuits are verified against locally.
          # noirup prepends the "v" itself for a numeric version.
          toolchain: 1.0.0-beta.22
      # The three packages that carry tests. The bench-* workspace members are
      # measurements, not checks, and are not run here.
      - name: nargo test
        working-directory: circuits
        run: |
          for pkg in notes shield transfer; do
            echo "::group::nargo test $pkg"
            (cd "$pkg" && nargo test)
            echo "::endgroup::"
          done
      # Deletes one constraint at a time and requires the paired adversarial test
      # to notice. Without it, a should_fail test can keep passing for a reason
      # that has nothing to do with the constraint it is named after, and the
      # constraint can be removed with the suite still green.
      - run: node audits/circuits/mutants.mjs
      # The compiled artifacts are gitignored, so build the two circuits the pool
      # calls before comparing their public inputs against it.
      - name: public inputs match the pool
        run: |
          (cd circuits && nargo compile --package transfer && nargo compile --package shield)
          node audits/circuits/publicinputs.mjs
